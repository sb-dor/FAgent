# Compiles the `// file:` code examples of assets/knowledge/rules/*.md. The test in
# test/feature/skills/builtin_knowledge_content_test.dart writes them into lib/ (flat), runs
# build_runner and `dart analyze` here.
name: knowledge_templates
description: Analysis fixture for the built-in skill templates.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  control:
    git:
      url: https://github.com/PlugFox/control.git
      ref: 685a9bc6ef60c987b99b5526e125813adba54e2a
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.6
  clock: ^1.1.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
