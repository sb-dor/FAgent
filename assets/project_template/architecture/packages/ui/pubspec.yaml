name: ui
description: Shared UI Components, Widgets, Fonts, Colors and Theme
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.4

# https://dart.dev/tools/pub/workspaces
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  intl:
  collection:
  #google_fonts:

dev_dependencies:
  # Test
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # The app lists the shader too (its pubspec.yaml); `Shimmer` loads it as
  # `packages/ui/shaders/shimmer.frag`.
  shaders:
    - shaders/shimmer.frag
